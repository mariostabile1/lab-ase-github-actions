info:
  name: calc wrong arguments
  type: http
  seq: 3

http:
  method: POST
  url: "{{calcUrl}}/operations"
  body:
    type: json
    data: |-
      {"type": "add", "arguments": [1]}
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.error
      operator: eq
      value: "invalid_arguments"

settings:
  encodeUrl: true
