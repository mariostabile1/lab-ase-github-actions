info:
  name: string wrong arguments
  type: http
  seq: 3

http:
  method: POST
  url: "{{stringUrl}}/operations"
  body:
    type: json
    data: |-
      {"type": "upper", "arguments": ["a", "b"]}
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.error
      operator: eq
      value: "invalid_arguments"

settings:
  encodeUrl: true
