info:
  name: string concat
  type: http
  seq: 2

http:
  method: POST
  url: "{{stringUrl}}/operations"
  body:
    type: json
    data: |-
      {"type": "concat", "arguments": ["a", "b"]}
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.result
      operator: eq
      value: "ab"

settings:
  encodeUrl: true
