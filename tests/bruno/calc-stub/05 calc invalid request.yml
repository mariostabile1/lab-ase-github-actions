info:
  name: calc invalid request
  type: http
  seq: 5

http:
  method: POST
  url: "{{calcUrl}}/operations"
  body:
    type: json
    data: |-
      {"type": "div", "arguments": [10, 0]}
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.error
      operator: eq
      value: "division_by_zero"

settings:
  encodeUrl: true
