info:
  name: string history fails
  type: http
  seq: 4

http:
  method: POST
  url: "{{stringUrl}}/operations"
  body:
    type: json
    data: |-
      {"type": "upper", "arguments": ["500"]}
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "502"
    - expression: res.body.error
      operator: eq
      value: "history_unavailable"

settings:
  encodeUrl: true
